[project]
name = "aegis-sdk"
version = "0.1.0"
description = "AEGIS containment SDK — wraps agent tool-calling with policy enforcement"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
bedrock = ["boto3>=1.34"]
langchain = ["langchain>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
