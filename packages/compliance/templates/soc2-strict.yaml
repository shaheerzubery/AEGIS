# AEGIS policy template — SOC 2 "strict" posture.
#
# Same shape as packages/policy-engine/policy.example.yaml — apply exactly
# the same way, no new mechanism:
#   aegisctl policy apply --tenant <name> packages/compliance/templates/soc2-strict.yaml
#
# Every field below is commented with the Trust Services Criteria control
# it maps to — see ../CONTROL_MAPPING.md for the full rationale table.
# This is a starting point for a real auditor conversation, not a
# certification — see CONTROL_MAPPING.md's disclaimer.
#
# "Strict" = minimal explicit allowlists, tight rate limits, narrow
# operational hours, low violation tolerance before suspension. Intended
# for agents handling the most sensitive tenants/data.

profile:
  name: soc2-strict
  description: >
    Minimal-privilege containment profile for SOC 2-relevant deployments —
    deny-by-default everywhere, narrow allowlists, aggressive suspension.

allowed_actions:
  - type: file_read
    paths: ["/data/**"]

denied_actions:
  - type: shell_exec
  - type: credential_access
  - type: http_request
    methods: [POST, PUT, DELETE]

# CC6.8 — restriction of unauthorized/malicious network destinations.
# Deny-by-default with a single explicit domain; add real destinations one
# at a time, deliberately, not as a broad allowlist.
network:
  default_action: deny
  allowed_domains:
    - example.com
  denied_domains: []

# CC6.1 / CC6.6 — logical access restricted to authorized users, enforced
# as least privilege. Empty by default: add tools one at a time as a
# specific agent's task requires them, not preemptively.
allowed_tools: []

# C1.1 / C1.2 — confidentiality: even the credential broker's allowlist
# starts empty. A tenant that needs protected-api access should add it
# explicitly, understanding that's a confidentiality-relevant decision.
allowed_credential_actions: {}

# CC7.1 — configuration baselines. Deliberately tight: this is a ceiling
# meant to be noticed if it's ever actually hit.
rate_limits:
  max_actions_per_minute: 20
  max_data_volume_mb_per_session: 25

# CC6.1 — logical access restricted to authorized users during defined
# operating hours. Example business-hours window (UTC) — replace with your
# actual operating window.
time_constraints:
  operational_hours: "06:00-20:00"

# CC7.3 / CC7.4 — incident evaluation and response. Two violations (not
# five) before automatic suspension, and any self-modification attempt is
# treated as critical immediately (see packages/anomaly-detector's
# self_modification rule, which has no threshold at all — it escalates on
# the first hit regardless of this file).
escalation:
  on_denied_action: soft_pause
  on_repeated_violations:
    threshold: 2
    window_seconds: 60
    action: hard_suspend
  on_self_modification_attempt: emergency_kill
