# AEGIS policy template — HIPAA-relevant posture.
#
# Same shape as packages/policy-engine/policy.example.yaml — apply exactly
# the same way, no new mechanism:
#   aegisctl policy apply --tenant <name> packages/compliance/templates/hipaa.yaml
#
# Every field below is commented with the HIPAA Security Rule control it
# maps to — see ../HIPAA_MAPPING.md for the full rationale table AND its
# disclaimer (this is a starting point for a real compliance/legal
# conversation, not a certification — AEGIS cannot make anything
# "HIPAA-compliant" on its own).
#
# Tuned toward the "strict" end of this repo's SOC 2 templates — PHI
# exposure risk from an agent misconfiguration is a materially different
# failure mode than a typical SaaS confidentiality incident, so this
# starts from minimal allowlists rather than a working-agent default.
# Pair this with packages/content-guardrail's PII masking (on by default,
# not something this file controls) for outbound text screening — see
# ../HIPAA_MAPPING.md's note on PHI vs. what content-guardrail detects.

profile:
  name: hipaa
  description: >
    Minimal-privilege containment profile for agents that may touch
    PHI-adjacent data — deny-by-default everywhere, narrow allowlists,
    aggressive suspension on violation.

allowed_actions:
  - type: file_read
    paths: ["/data/**"]

denied_actions:
  - type: shell_exec
  - type: credential_access
  - type: http_request
    methods: [POST, PUT, DELETE]

# HIPAA §164.312(e)(1) — transmission security: deny-by-default network
# egress with a single explicit domain. Add real destinations one at a
# time, not as a broad allowlist.
network:
  default_action: deny
  allowed_domains:
    - example.com
  denied_domains: []

# HIPAA §164.312(a)(1) — access control, least privilege. Empty by
# default: add tools one at a time as a specific agent's task requires
# them.
allowed_tools: []

# HIPAA §164.312(a)(1) / Confidentiality — even the credential broker's
# allowlist starts empty.
allowed_credential_actions: {}

# HIPAA §164.308(a)(1)(ii)(D) — activity review baselines. Deliberately
# tight ceiling.
rate_limits:
  max_actions_per_minute: 20
  max_data_volume_mb_per_session: 25

# No operational-hours restriction by default — healthcare systems
# commonly operate continuously. Narrow this if the deploying
# organization's own policy requires a defined window.
time_constraints:
  operational_hours: "00:00-23:59"

# HIPAA §164.308(a)(6)(ii) — incident response. Two violations (not
# five) before automatic suspension; any self-modification attempt
# escalates immediately regardless of this threshold (see
# packages/anomaly-detector's self_modification rule).
escalation:
  on_denied_action: soft_pause
  on_repeated_violations:
    threshold: 2
    window_seconds: 60
    action: hard_suspend
  on_self_modification_attempt: emergency_kill
